<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Admin | Chidiya Ud</title>
    <link href="https://fonts.googleapis.com/css2?family=Atma:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="data-page admin-page">
      <header class="data-header">
        <div><a class="back-link" href="%BASE_URL%">← Back to game</a><h1>Chidiya Ud admin</h1></div>
        <button id="admin-signout" class="text-button" type="button" hidden>Sign out</button>
      </header>
      <section id="admin-login" class="admin-login" aria-labelledby="admin-login-title">
        <h2 id="admin-login-title">Sign in</h2>
        <form id="admin-login-form" class="field-stack">
          <label for="admin-name">Name</label><input id="admin-name" autocomplete="username" required />
          <label for="admin-password">Password</label><input id="admin-password" type="password" autocomplete="current-password" required />
          <p id="admin-login-error" class="field-error" role="alert"></p>
          <button type="submit">Sign in</button>
        </form>
      </section>
      <div id="admin-workspace" hidden>
        <p id="admin-identity" class="data-status"></p>
        <nav id="admin-tabs" class="admin-tabs" aria-label="Admin sections"></nav>
        <p id="admin-status" class="data-status" role="status"></p>
        <section id="items-panel" class="admin-panel" hidden></section>
        <section id="scores-panel" class="admin-panel" hidden></section>
        <section id="users-panel" class="admin-panel" hidden></section>
      </div>
    </main>
    <script type="module" src="/src/site/admin.ts"></script>
  </body>
</html>
